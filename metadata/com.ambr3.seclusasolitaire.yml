Name: Seclusa Solitaire

Summary: Privacy-first offline solitaire — 18 games (fork)
Description: |-
  Seclusa Solitaire is a privacy-first fork of Tobias Bielefeld's
  Simple Solitaire Collection (GPL), modernised for Material 3.

  Fully offline: zero permissions, no network, no accounts, no ads,
  no tracking. Game state stays on your device.

  Eighteen games: Aces Up, Calculation, Canfield, Forty & Eight,
  FreeCell, Golf, Grandfather's Clock, Gypsy, Klondike, Maze, Mod3,
  Napoleon's Tomb, Pyramid, Simple Simon, Spider, Spiderette,
  TriPeaks and Yukon.

  Customizable: 10 card themes, 10 card backgrounds and 6 playfield
  colours. Auto-save, high scores, undo, hints, landscape and tablet.

